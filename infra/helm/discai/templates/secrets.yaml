apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: '{{ include "discai.fullname" . }}-inf-secret'
  labels:
    {{- include "discai.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  syncConfig:
    resyncInterval: 10s
  authentication:
    kubernetesAuth:
      identityId: ea9c7e43-4921-4cac-bac7-8fc8b1a24440
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: infisical2
      secretsScope:
        projectSlug: discai
        envSlug: prod
        secretsPath: /
        recursive: true
  managedKubeSecretReferences:
    - secretName: "{{- include "discai.fullname" . }}-secrets"
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        metadata:
          annotations:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-5"
            helm.sh/hook-delete-policy: before-hook-creation
  managedKubeConfigMapReferences:
    - configMapName: '{{- include "discai.fullname" . }}-configmap'
      configMapNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        metadata:
          annotations:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-5"
            helm.sh/hook-delete-policy: before-hook-creation
        data:
          PYTHON_ENV: "production"
          DB_HOST: "10.10.10.103"
          DB_PORT: "5432"
          POSTGRESQL_USERNAME: "discai"
          POSTGRESQL_DATABASE: "discai"
          AGNO_MONITOR: "true"
          GOOGLE_GENAI_USE_VERTEXAI: "false"
          CHAT_MODEL: "{{"{{"}} .CHAT_MODEL.Value {{"}}"}}"
          TITLE_MODEL: "{{"{{"}} .TITLE_MODEL.Value {{"}}"}}"
