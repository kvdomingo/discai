name: discai

volumes:
  db-data:
  venv-data:

services:
  bot:
    build: .
    image: ghcr.io/kvdomingo/discord-ai
    restart: unless-stopped
    environment:
      GOOGLE_GENAI_USE_VERTEXAI: false
      PYTHON_ENV: development
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      CHAT_MODEL: ${CHAT_MODEL}
      TITLE_MODEL: ${TITLE_MODEL}
      JEV_TOKEN: ${JEV_TOKEN}
    volumes:
      - .:/app
      - venv-data:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: pyproject.toml
          action: restart
        - path: uv.lock
          action: restart

  db:
    image: ghcr.io/kvdomingo/postgresql-pig:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRESQL_USERNAME}",
          "-d",
          "${POSTGRESQL_DATABASE}",
        ]
      timeout: 2s
      interval: 20s
      start_period: 10s
      retries: 3

  rest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@db:5432/${POSTGRESQL_DATABASE}
      PGRST_DB_SCHEMAS: public
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_JWT_IS_BASE64: ${PGRST_JWT_IS_BASE64}
      PGRST_DB_ANON_ROLE: anon
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.18.3
    restart: unless-stopped
    environment:
      API_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - rest
